<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | CreateYourSong</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fff0f7, #ffffff);
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR */

        .navbar {
            background: rgba(255,255,255,0.95);
            padding: 16px 0;
            box-shadow: 0 3px 15px rgba(255,79,145,0.08);
        }

        .navbar-brand {
            color: #ff4d94 !important;
            font-size: 24px;
            font-weight: 700;
            text-decoration: none;
        }

        .home-link {
            color: #444;
            text-decoration: none;
            font-weight: 500;
        }

        .home-link:hover {
            color: #ff4d94;
        }

        /* MAIN */

        .signup-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 15px;
        }

        .signup-card {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 45px rgba(255,79,145,0.14);
            animation: cardAnimation 0.8s ease;
        }

        .signup-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #ffe4f0;
            color: #ff4d94;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .signup-card h1 {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #4a1a2e;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* FORM */

        .form-label {
            font-weight: 500;
            color: #4a1a2e;
        }

        .required {
            color: #ff4d94;
        }

        .form-control {
            padding: 13px;
            border: 1px solid #eeeeee;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: #ff4d94;
            box-shadow: 0 0 0 0.2rem rgba(255,77,148,0.12);
        }

        .input-group .form-control {
            border-right: none;
        }

        .password-toggle {
            background: white;
            border: 1px solid #eeeeee;
            cursor: pointer;
            color: #ff4d94;
        }

        /* PASSWORD RULES */

        .password-rules {
            margin-top: 10px;
            padding: 12px;
            background: #fff7fa;
            border-radius: 10px;
            font-size: 12px;
        }

        .password-rules div {
            margin: 4px 0;
        }

        .rule {
            color: #888;
        }

        .rule.valid {
            color: #198754;
        }

        .rule i {
            margin-right: 5px;
        }

        /* BUTTON */

        .signup-btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 30px;
            background: linear-gradient(135deg, #ff4d94, #ff70aa);
            color: white;
            font-weight: 600;
            font-size: 16px;
            margin-top: 10px;
            transition: 0.3s;
        }

        .signup-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255,77,148,0.30);
        }

        .signup-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* MESSAGES */

        .message {
            display: none;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .error-message {
            background: #fff0f0;
            color: #d6336c;
        }

        .success-message {
            background: #f0fff5;
            color: #198754;
        }

        .show {
            display: block;
        }

        /* LOGIN LINK */

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #777;
            font-size: 14px;
        }

        .login-link a {
            color: #ff4d94;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* FOOTER */

        footer {
            background: white;
            border-top: 1px solid #f4e1e8;
            text-align: center;
            padding: 18px;
            color: #999;
            font-size: 13px;
        }

        @keyframes cardAnimation {

            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }

        @media(max-width:500px) {

            .signup-card {
                padding: 28px 20px;
            }

            .signup-card h1 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="container">

            <a
                href="index.html"
                class="navbar-brand">

                <i class="bi bi-music-note-beamed"></i>

                CreateYourSong

            </a>

            <a
                href="login.html"
                class="home-link float-end">

                <i class="bi bi-box-arrow-in-right"></i>

                Login

            </a>

        </div>

    </nav>


    <!-- SIGNUP -->

    <section class="signup-section">

        <div class="signup-card">


            <div class="signup-icon">

                <i class="bi bi-person-plus"></i>

            </div>


            <h1>
                Create Your Account
            </h1>


            <p class="subtitle">

                Join CreateYourSong and create personalized songs

            </p>


            <!-- ERROR -->

            <div
                id="errorMessage"
                class="message error-message">

                <i class="bi bi-exclamation-circle"></i>

                <span id="errorText"></span>

            </div>


            <!-- SUCCESS -->

            <div
                id="successMessage"
                class="message success-message">

                <i class="bi bi-check-circle"></i>

                <span id="successText"></span>

            </div>


            <!-- FORM -->

            <form id="signupForm">


                <!-- NAME -->

                <div class="mb-4">

                    <label class="form-label">

                        Full Name
                        <span class="required">*</span>

                    </label>

                    <input
                        type="text"
                        id="name"
                        class="form-control"
                        placeholder="Enter your full name"
                        maxlength="80"
                        required>

                </div>


                <!-- EMAIL -->

                <div class="mb-4">

                    <label class="form-label">

                        Email Address
                        <span class="required">*</span>

                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required>

                </div>


                <!-- PASSWORD -->

                <div class="mb-3">

                    <label class="form-label">

                        Password
                        <span class="required">*</span>

                    </label>


                    <div class="input-group">

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Create a strong password"
                            autocomplete="new-password"
                            required>

                        <span
                            class="input-group-text password-toggle"
                            onclick="togglePassword('password','eye1')">

                            <i
                                class="bi bi-eye"
                                id="eye1">
                            </i>

                        </span>

                    </div>


                    <!-- PASSWORD RULES -->

                    <div class="password-rules">

                        <div
                            id="lengthRule"
                            class="rule">

                            <i class="bi bi-circle"></i>

                            At least 8 characters

                        </div>

                        <div
                            id="upperRule"
                            class="rule">

                            <i class="bi bi-circle"></i>

                            One uppercase letter

                        </div>

                        <div
                            id="lowerRule"
                            class="rule">

                            <i class="bi bi-circle"></i>

                            One lowercase letter

                        </div>

                        <div
                            id="numberRule"
                            class="rule">

                            <i class="bi bi-circle"></i>

                            One number

                        </div>

                        <div
                            id="specialRule"
                            class="rule">

                            <i class="bi bi-circle"></i>

                            One special character

                        </div>

                        <div
                            id="spaceRule"
                            class="rule">

                            <i class="bi bi-circle"></i>

                            No spaces

                        </div>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="mb-4">

                    <label class="form-label">

                        Confirm Password
                        <span class="required">*</span>

                    </label>


                    <div class="input-group">

                        <input
                            type="password"
                            id="confirmPassword"
                            class="form-control"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required>

                        <span
                            class="input-group-text password-toggle"
                            onclick="togglePassword('confirmPassword','eye2')">

                            <i
                                class="bi bi-eye"
                                id="eye2">
                            </i>

                        </span>

                    </div>

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="signup-btn"
                    id="signupButton">

                    <i class="bi bi-person-plus"></i>

                    Create Account

                </button>


            </form>


            <!-- LOGIN LINK -->

            <div class="login-link">

                Already have an account?

                <a href="login.html">

                    Login here

                </a>

            </div>


        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        © 2026 CreateYourSong. All rights reserved.

    </footer>



    <script>


        /* =====================================================
           GOOGLE APPS SCRIPT URL
        ===================================================== */

        const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbyVKZouiZ90lDU65_jL3hMcPCOJdJVniDKPx4J3XHyhR1xoWs5zbAz6-GMInr4BnGAx/exec";


        /* =====================================================
           PASSWORD SHOW / HIDE
        ===================================================== */

        function togglePassword(inputId, iconId) {

            const input =
                document.getElementById(inputId);

            const icon =
                document.getElementById(iconId);


            if (input.type === "password") {

                input.type = "text";

                icon.classList.remove("bi-eye");

                icon.classList.add("bi-eye-slash");

            } else {

                input.type = "password";

                icon.classList.remove("bi-eye-slash");

                icon.classList.add("bi-eye");

            }

        }


        /* =====================================================
           PASSWORD RULE CHECK
        ===================================================== */

        const password =
            document.getElementById("password");


        password.addEventListener(
            "input",
            function() {

                const value =
                    password.value;


                checkRule(
                    "lengthRule",
                    value.length >= 8
                );


                checkRule(
                    "upperRule",
                    /[A-Z]/.test(value)
                );


                checkRule(
                    "lowerRule",
                    /[a-z]/.test(value)
                );


                checkRule(
                    "numberRule",
                    /[0-9]/.test(value)
                );


                checkRule(
                    "specialRule",
                    /[^A-Za-z0-9]/.test(value)
                );


                checkRule(
                    "spaceRule",
                    !/\s/.test(value)
                );

            }
        );


        function checkRule(id, valid) {

            const element =
                document.getElementById(id);

            const icon =
                element.querySelector("i");


            if (valid) {

                element.classList.add("valid");

                icon.className =
                    "bi bi-check-circle-fill";

            } else {

                element.classList.remove("valid");

                icon.className =
                    "bi bi-circle";

            }

        }


        /* =====================================================
           SIGNUP FORM
        ===================================================== */

        document
        .getElementById("signupForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const name =
                    document
                    .getElementById("name")
                    .value
                    .trim();


                const email =
                    document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();


                const passwordValue =
                    document
                    .getElementById("password")
                    .value;


                const confirmPassword =
                    document
                    .getElementById("confirmPassword")
                    .value;


                const errorMessage =
                    document
                    .getElementById("errorMessage");


                const successMessage =
                    document
                    .getElementById("successMessage");


                const errorText =
                    document
                    .getElementById("errorText");


                const successText =
                    document
                    .getElementById("successText");


                const signupButton =
                    document
                    .getElementById("signupButton");


                /* CLEAR MESSAGES */

                errorMessage.classList.remove("show");

                successMessage.classList.remove("show");


                /* NAME */

                if (name === "") {

                    showError(
                        "Please enter your full name."
                    );

                    return;

                }


                /* EMAIL */

                const emailPattern =
                    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


                if (!emailPattern.test(email)) {

                    showError(
                        "Please enter a valid email address."
                    );

                    return;

                }


                /* PASSWORD */

                const strongPassword =
                    /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9])\S{8,}$/;


                if (!strongPassword.test(passwordValue)) {

                    showError(
                        "Password does not meet the security requirements."
                    );

                    return;

                }


                /* CONFIRM PASSWORD */

                if (
                    passwordValue !==
                    confirmPassword
                ) {

                    showError(
                        "Passwords do not match."
                    );

                    return;

                }


                /* LOADING */

                signupButton.disabled = true;

                signupButton.innerHTML =
                    '<span class="spinner-border spinner-border-sm"></span> Creating Account...';


                try {


                    /* SEND TO GOOGLE APPS SCRIPT */

                    const response =
                        await fetch(
                            SCRIPT_URL,
                            {
                                method: "POST",

                                body: JSON.stringify({

                                    formType: "signup",

                                    name: name,

                                    email: email,

                                    password: passwordValue

                                })
                            }
                        );


                    const result =
                        await response.json();


                    /* SUCCESS */

                    if (result.success) {


                        successText.textContent =
                            "Account created successfully! Redirecting to login...";


                        successMessage.classList.add(
                            "show"
                        );


                        signupButton.innerHTML =
                            '<i class="bi bi-check-circle"></i> Account Created';


                        /* REDIRECT TO LOGIN */

                        setTimeout(
                            function() {

                                window.location.href =
                                    "login.html";

                            },
                            1500
                        );


                    } else {


                        /* ERROR FROM GOOGLE SHEETS */

                        showError(
                            result.message ||
                            "Unable to create account."
                        );


                        signupButton.disabled =
                            false;


                        signupButton.innerHTML =
                            '<i class="bi bi-person-plus"></i> Create Account';

                    }


                } catch (error) {


                    console.error(
                        "Signup Error:",
                        error
                    );


                    showError(
                        "Unable to connect to Google Sheets. Please check your internet connection and try again."
                    );


                    signupButton.disabled =
                        false;


                    signupButton.innerHTML =
                        '<i class="bi bi-person-plus"></i> Create Account';

                }

            }
        );


        /* =====================================================
           SHOW ERROR
        ===================================================== */

        function showError(message) {

            const errorMessage =
                document.getElementById(
                    "errorMessage"
                );

            const errorText =
                document.getElementById(
                    "errorText"
                );


            errorText.textContent =
                message;


            errorMessage.classList.add(
                "show"
            );

        }

    </script>


</body>

</html>
