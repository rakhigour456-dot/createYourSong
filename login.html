<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CreateYourSong</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #fff0f6, #ffffff);
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            padding: 16px 0;
            box-shadow: 0 3px 15px rgba(255, 79, 145, 0.08);

            animation: navbarDown 0.8s ease;
            position: relative;
            z-index: 10;
        }

        .navbar-brand {
            font-size: 24px;
            font-weight: 700;
            color: #ff4f91 !important;
            transition: 0.3s;
        }

        .navbar-brand:hover {
            transform: scale(1.03);
        }

        .navbar-brand i {
            margin-right: 7px;
            animation: musicFloat 2s ease-in-out infinite;
            display: inline-block;
        }

        .nav-link {
            color: #444 !important;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: #ff4f91 !important;
            transform: translateY(-2px);
        }


        /* ================= BACKGROUND CIRCLES ================= */

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
        }

        body::before {
            width: 280px;
            height: 280px;
            background: rgba(255, 79, 145, 0.10);
            top: 100px;
            left: -120px;
            animation: floatingCircle 7s ease-in-out infinite;
        }

        body::after {
            width: 350px;
            height: 350px;
            background: rgba(255, 182, 211, 0.14);
            bottom: -150px;
            right: -120px;
            animation: floatingCircle 9s ease-in-out infinite reverse;
        }


        /* ================= LOGIN AREA ================= */

        .login-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            position: relative;
        }


        /* ================= LOGIN CARD ================= */

        .login-card {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.96);
            padding: 40px;
            border-radius: 25px;

            box-shadow: 0 15px 45px rgba(255, 79, 145, 0.12);

            animation: cardEntrance 0.9s cubic-bezier(.17,.67,.35,1.2);
            transition: 0.4s;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(255, 79, 145, 0.04);
            top: -100px;
            right: -80px;
            transition: 0.5s;
        }

        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 60px rgba(255, 79, 145, 0.18);
        }

        .login-card:hover::before {
            transform: scale(1.4);
        }


        /* ================= LOGIN ICON ================= */

        .login-icon {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #ffe5ef;
            color: #ff4f91;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;
            margin: 0 auto 20px;

            animation:
                iconEntrance 1s ease 0.3s both,
                iconFloat 3s ease-in-out 1.5s infinite;

            transition: 0.3s;
        }

        .login-icon:hover {
            transform: scale(1.1) rotate(5deg);
            background: #ff4f91;
            color: white;
        }


        /* ================= HEADING ================= */

        .login-card h1 {
            text-align: center;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 8px;

            animation: fadeUp 0.7s ease 0.4s both;
        }

        .login-card .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;

            animation: fadeUp 0.7s ease 0.5s both;
        }


        /* ================= FORM ================= */

        .form-label {
            font-weight: 500;
        }

        .required {
            color: #ff4f91;
        }

        .mb-4 {
            animation: fadeUp 0.6s ease both;
        }

        .mb-4:nth-of-type(1) {
            animation-delay: 0.5s;
        }

        .mb-4:nth-of-type(2) {
            animation-delay: 0.65s;
        }


        .form-control {
            border: 1px solid #eee;
            padding: 13px;
            transition: all 0.3s ease;
        }

        .form-control:hover {
            border-color: #ffb6d2;
        }

        .form-control:focus {
            border-color: #ff4f91;
            box-shadow: 0 0 0 0.2rem rgba(255, 79, 145, 0.12);
            transform: translateY(-2px);
        }

        .input-group-text {
            background: white;
            border: 1px solid #eee;
            color: #ff4f91;
            transition: 0.3s;
        }

        .password-toggle {
            cursor: pointer;
            border-left: none;
        }

        .password-toggle:hover {
            background: #fff0f6;
        }


        /* ================= CHECKBOX ================= */

        .form-check {
            animation: fadeUp 0.6s ease 0.8s both;
        }

        .form-check-input {
            cursor: pointer;
        }

        .form-check-input:checked {
            background-color: #ff4f91;
            border-color: #ff4f91;
        }


        /* ================= LOGIN BUTTON ================= */

        .login-btn {
            width: 100%;
            border: none;
            background: linear-gradient(135deg, #ff4f91, #ff6fa8);
            color: white;

            padding: 14px;
            border-radius: 30px;

            font-weight: 600;
            font-size: 16px;
            margin-top: 10px;

            transition: all 0.3s ease;

            animation: fadeUp 0.7s ease 0.9s both;

            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.35),
                transparent
            );

            transition: 0.5s;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #e83e7e, #ff4f91);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 79, 145, 0.30);
        }

        .login-btn:active {
            transform: scale(0.97);
        }


        /* ================= ERROR / SUCCESS ================= */

        .error-message,
        .success-message {
            display: none;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .error-message {
            background: #fff0f0;
            color: #d6336c;
        }

        .success-message {
            background: #f0fff5;
            color: #198754;
        }

        .show-message {
            display: block;
            animation: messageAnimation 0.4s ease;
        }


        /* ================= SECURITY ================= */

        .security-note {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 12px;

            animation: fadeUp 0.7s ease 1s both;
        }


        /* ================= FOOTER ================= */

        footer {
            background: white;
            border-top: 1px solid #f4e1e8;
            padding: 20px;
            text-align: center;
            color: #999;
            font-size: 13px;

            animation: fadeUp 0.8s ease;
        }


        /* ================= ANIMATIONS ================= */

        @keyframes navbarDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.94);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        @keyframes iconEntrance {
            from {
                opacity: 0;
                transform: scale(0) rotate(-180deg);
            }

            to {
                opacity: 1;
                transform: scale(1) rotate(0);
            }
        }


        @keyframes iconFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }
        }


        @keyframes musicFloat {

            0%,
            100% {
                transform: translateY(0) rotate(0);
            }

            50% {
                transform: translateY(-4px) rotate(8deg);
            }
        }


        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        @keyframes floatingCircle {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(30px, -25px);
            }
        }


        @keyframes messageAnimation {

            0% {
                opacity: 0;
                transform: translateY(-10px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* ================= MOBILE ================= */

        @media (max-width: 500px) {

            .login-card {
                padding: 30px 22px;
            }

            .login-card h1 {
                font-size: 26px;
            }

            .navbar-brand {
                font-size: 20px;
            }

            .login-section {
                padding: 40px 15px;
            }
        }

    </style>
</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="container">

            <a class="navbar-brand" href="#index.html">

                <i class="bi bi-music-note-beamed"></i>

                CreateYourSong

            </a>


            <a class="nav-link float-end" href="#index.html">

                <i class="bi bi-house"></i>

                Home

            </a>

        </div>

    </nav>



    <!-- ================= LOGIN ================= -->

    <section class="login-section">

        <div class="login-card">

            <div class="login-icon">

                <i class="bi bi-person-lock"></i>

            </div>


            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to create your personalized song
            </p>



            <!-- ERROR -->

            <div id="errorMessage" class="error-message">

                <i class="bi bi-exclamation-circle"></i>

                Please enter valid login details.

            </div>



            <!-- SUCCESS -->

            <div id="successMessage" class="success-message">

                <i class="bi bi-check-circle"></i>

                Login successful! Redirecting...

            </div>



            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="mb-4">

                    <label class="form-label">

                        Email Address

                        <span class="required">*</span>

                    </label>


                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required>

                </div>



                <!-- PASSWORD -->

                <div class="mb-4">

                    <label class="form-label">

                        Password

                        <span class="required">*</span>

                    </label>


                    <div class="input-group">

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Enter your password"
                            minlength="6"
                            autocomplete="current-password"
                            required>


                        <span
                            class="input-group-text password-toggle"
                            onclick="togglePassword()">

                            <i
                                class="bi bi-eye"
                                id="eyeIcon">
                            </i>

                        </span>

                    </div>


                    <small class="text-muted">

                        Password must contain at least 6 characters.

                    </small>

                </div>



                <!-- REMEMBER -->

                <div class="form-check mb-4">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="remember">

                    <label
                        class="form-check-label"
                        for="remember">

                        Remember me

                    </label>

                </div>



                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-btn">

                    <i class="bi bi-box-arrow-in-right"></i>

                    Login

                </button>

            </form>



            <!-- SECURITY -->

            <div class="security-note">

                <i class="bi bi-shield-check"></i>

                Your information is kept private.

            </div>

        </div>

    </section>



    <!-- ================= FOOTER ================= -->

    <footer>

   

    </footer>



    <!-- ================= JAVASCRIPT ================= -->

    <script>


        /* ================= PASSWORD SHOW/HIDE ================= */

        function togglePassword() {

            const password =
                document.getElementById("password");

            const eyeIcon =
                document.getElementById("eyeIcon");


            if (password.type === "password") {

                password.type = "text";

                eyeIcon.classList.remove("bi-eye");

                eyeIcon.classList.add("bi-eye-slash");

            } else {

                password.type = "password";

                eyeIcon.classList.remove("bi-eye-slash");

                eyeIcon.classList.add("bi-eye");

            }

        }



        /* ================= LOGIN ================= */

        document
            .getElementById("loginForm")
            .addEventListener("submit", function (event) {

                event.preventDefault();


                const email =
                    document.getElementById("email").value.trim();


                const password =
                    document.getElementById("password").value.trim();


                const errorMessage =
                    document.getElementById("errorMessage");


                const successMessage =
                    document.getElementById("successMessage");


                errorMessage.classList.remove("show-message");

                successMessage.classList.remove("show-message");



                /* CHECK EMPTY FIELDS */

                if (email === "" || password === "") {

                    errorMessage.innerHTML =
                        '<i class="bi bi-exclamation-circle"></i> Please fill in all required fields.';

                    errorMessage.classList.add("show-message");

                    return;

                }



                /* CHECK EMAIL */

                const emailPattern =
                    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


                if (!emailPattern.test(email)) {

                    errorMessage.innerHTML =
                        '<i class="bi bi-exclamation-circle"></i> Please enter a valid email address.';

                    errorMessage.classList.add("show-message");

                    return;

                }



                /* CHECK PASSWORD LENGTH */

                if (password.length < 6) {

                    errorMessage.innerHTML =
                        '<i class="bi bi-exclamation-circle"></i> Password must contain at least 6 characters.';

                    errorMessage.classList.add("show-message");

                    return;

                }



                /* SAVE LOGIN STATUS */

                localStorage.setItem(
                    "customerLoggedIn",
                    "true"
                );


                localStorage.setItem(
                    "customerEmail",
                    email
                );



                /* SUCCESS MESSAGE */

                successMessage.classList.add("show-message");



                /* BUTTON LOADING EFFECT */

                const loginButton =
                    document.querySelector(".login-btn");


                loginButton.innerHTML =
                    '<i class="bi bi-arrow-repeat"></i> Logging in...';


                loginButton.style.pointerEvents = "none";



                /* REDIRECT TO HOME */

                setTimeout(function () {

                    window.location.href = "index.html";

                }, 1200);

            });


    </script>


</body>

</html>
